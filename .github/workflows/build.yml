name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lyrics-linux:
    name: Lyrics and stems engines (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev xvfb

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.config/ChopLab/Models
          key: models-whisper-base-q5_1-htdemucs-4s-f16

      - name: Download models
        run: |
          mkdir -p ~/.config/ChopLab/Models
          cd ~/.config/ChopLab/Models
          test -f ggml-base-q5_1.bin || curl -L --fail -o ggml-base-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          test -f ggml-model-htdemucs-4s-f16.bin || curl -L --fail -o ggml-model-htdemucs-4s-f16.bin https://huggingface.co/datasets/Retrobear/demucs.cpp/resolve/main/ggml-model-htdemucs-4s-f16.bin
          ls -la
          sha256sum *.bin | tee ~/models.txt
          echo "::notice title=models::$(stat -c '%n %s' *.bin | tr '\n' ' ') $(sha256sum *.bin | tr '\n' ' ')"

      - name: Build tests
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target ChopLabTests ChopLabEngineTests

      - name: Analysis tests
        run: build/ChopLabTests_artefacts/Release/ChopLabTests | tee analysis.txt

      - name: Lyrics tests
        run: build/ChopLabTests_artefacts/Release/ChopLabTests --lyrics-test Tests/fixtures 0 2>&1 | tee lyrics.txt; exit ${PIPESTATUS[0]}

      - name: Stem separation tests (real model, threads, cancel, formats)
        run: build/ChopLabTests_artefacts/Release/ChopLabTests --stems-test Tests/fixtures 2>&1 | grep -v "^Load\|^load_demucs\|^Check\|^Model" | tee stems.txt; exit ${PIPESTATUS[0]}

      - name: Engine tests (pattern playback, undo, stems and lyrics through the plugin)
        run: xvfb-run -a build/ChopLabEngineTests_artefacts/Release/ChopLabEngineTests Tests/fixtures 2>&1 | tee engine.txt; exit ${PIPESTATUS[0]}

      - name: Report test output
        if: always()
        run: |
          for f in lyrics.txt stems.txt engine.txt; do
            [ -f "$f" ] || continue
            body=$(tail -c 3500 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=$f::$body"
          done

  windows:
    name: Windows VST3
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target ChopLab_VST3 ChopLabTests ChopLabHostTests ChopLabEngineTests --parallel

      - name: Analysis tests (tempo, key, time signature, chop points)
        run: build/ChopLabTests_artefacts/Release/ChopLabTests.exe

      - name: Download models (same code the plugin uses)
        run: |
          build/ChopLabTests_artefacts/Release/ChopLabTests.exe --download-model 0
          build/ChopLabTests_artefacts/Release/ChopLabTests.exe --download-stems-model

      - name: Lyrics tests
        shell: pwsh
        run: |
          & build/ChopLabTests_artefacts/Release/ChopLabTests.exe --lyrics-test Tests/fixtures 0 2>&1 | Tee-Object -FilePath lyrics.txt
          exit $LASTEXITCODE

      - name: Stem separation tests
        shell: pwsh
        run: |
          & build/ChopLabTests_artefacts/Release/ChopLabTests.exe --stems-test Tests/fixtures quick 2>&1 | Select-String -NotMatch -Pattern "^(Load|load_demucs|Check|Model)" | Tee-Object -FilePath stems.txt
          exit $LASTEXITCODE

      - name: Engine tests (pattern playback, undo, stems and lyrics through the plugin)
        shell: pwsh
        run: |
          & build/ChopLabEngineTests_artefacts/Release/ChopLabEngineTests.exe Tests/fixtures 2>&1 | Tee-Object -FilePath engine.txt
          exit $LASTEXITCODE

      - name: Plugin tests (load the VST3, play MIDI, check the audio, save and reload)
        run: build/ChopLabHostTests_artefacts/Release/ChopLabHostTests.exe build/ChopLab_artefacts/Release/VST3/ChopLab.vst3

      - name: Validate with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --skip-gui-tests --timeout-ms 300000 --validate build/ChopLab_artefacts/Release/VST3/ChopLab.vst3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report test output
        if: always()
        shell: pwsh
        run: |
          foreach ($f in @("lyrics.txt", "stems.txt", "engine.txt")) {
            if (-not (Test-Path $f)) { continue }
            $body = Get-Content $f -Raw
            if ($body.Length -gt 3500) { $body = $body.Substring($body.Length - 3500) }
            $body = $body.Replace("%", "%25").Replace("`r", "").Replace("`n", "%0A")
            Write-Output "::notice title=windows-$f::$body"
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build/ChopLab_artefacts/Release/VST3/ChopLab.vst3 dist/
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ChopLab-Windows-VST3
          path: dist/
