name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows VST3
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target ChopLab_VST3 ChopLabTests ChopLabHostTests --parallel

      - name: Analysis tests (tempo, key, time signature, chop points)
        run: build/ChopLabTests_artefacts/Release/ChopLabTests.exe

      - name: Plugin tests (load the VST3, play MIDI, check the audio, save and reload)
        run: build/ChopLabHostTests_artefacts/Release/ChopLabHostTests.exe build/ChopLab_artefacts/Release/VST3/ChopLab.vst3

      - name: Validate with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --skip-gui-tests --timeout-ms 300000 --validate build/ChopLab_artefacts/Release/VST3/ChopLab.vst3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build/ChopLab_artefacts/Release/VST3/ChopLab.vst3 dist/
          Copy-Item README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ChopLab-Windows-VST3
          path: dist/
